name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build net48 (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 版本号: tag 构建用 tag 名 (v0.0.0.5 -> 0.0.0.5)；普通 push 用默认
      - name: Resolve build version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+(\.\d+)?)$') {
            $v = $Matches[1]
            Write-Host "Tag 构建版本: $v"
            echo "version=$v" >> $env:GITHUB_OUTPUT
          } else {
            echo "version=0.0.0.0-ci" >> $env:GITHUB_OUTPUT
          }

      - name: Restore NuGet packages
        run: dotnet restore PrintServer.csproj

      - name: Build Release
        run: dotnet build PrintServer.csproj -c Release --no-restore
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.version }}

      - name: Verify output (single exe)
        shell: pwsh
        run: |
          $dist = 'bin/Release/net48'
          Write-Host "=== 输出目录内容 ==="
          Get-ChildItem $dist | Select-Object Name, Length
          $dllCount = (Get-ChildItem $dist -Filter *.dll).Count
          Write-Host "DLL 数量: $dllCount (应为 0, 单文件发布)"
          if (Test-Path "$dist/PrintServer.exe") {
            $size = (Get-Item "$dist/PrintServer.exe").Length
            Write-Host "PrintServer.exe ($([math]::Round($size/1MB,2)) MB) OK"
            Write-Host "版本: $((Get-Item "$dist/PrintServer.exe").VersionInfo.FileVersion)"
          } else {
            throw "PrintServer.exe 未生成!"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintServer-net48-x64
          path: bin/Release/net48/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    # 仅当推送的是 v* 标签时发布 (例如 v0.0.0.2)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: PrintServer-net48-x64
          path: dist

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            内网打印及扫描服务 C# 原生版 (${{ steps.tag.outputs.tag }})

            ## 功能
            - 打印: 图片/文本/PDF(poppler)/Office COM 静默打印 (指定打印机)
            - 打印: 新增奇数页/偶数页打印 (PDF/Word/Excel/PPT 支持, 用于手动双面; Excel/PPT 经中转 PDF 实现)
            - 网络: 启动自动开放 Windows 防火墙入站端口(可手动), 支持局域网跨设备访问
            - 扫描: WIA 枚举 + 防锁自动释放
            - 网页: 打印/扫描/文件管理/日志管理 (可设置访问密码)
            - 日志: 按天生成, 记录访问 IP 与打印/扫描内容
            - 托盘: 开机自启/端口/密码/网络配置/任意天日志/开放防火墙端口

            ## 部署
            下载 `PrintServer.exe` (单文件, 自包含前端/poppler/图标),
            目标机需安装 .NET Framework 4.8 (Win10/11 自带, Win7 SP1 需装一次)。
          files: dist/PrintServer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}