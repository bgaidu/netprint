name: Cleanup Actions Storage

on:
  workflow_dispatch: # 允许在网页上点击按钮手动触发
  schedule:
    - cron: '0 0 * * *' # 每天自动跑一次

# 删除 artifacts / caches 需要 actions: write 权限
permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          echo "正在清理 Artifacts..."
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r id; do
            echo "  delete artifact: $id"
            gh api -X DELETE "repos/$repo/actions/artifacts/$id" || echo "  (skip $id)"
          done

      - name: Delete old caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          echo "正在清理 Caches..."
          gh api --paginate "repos/$repo/actions/caches?per_page=100" \
            --jq '.actions_caches[].id' |
          while read -r id; do
            echo "  delete cache: $id"
            gh api -X DELETE "repos/$repo/actions/caches/$id" || echo "  (skip $id)"
          done
